<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PinBox">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1015" media="(prefers-color-scheme: dark)">
<title>PinBox</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --bg:#F2F3F5; --bg-a:rgba(242,243,245,.84); --surface:#FFFFFF; --field:#E8EAEE; --paper:#FFFFFF;
    --fg:#101216; --dim:#656B77; --line:rgba(16,18,22,.1);
    --ink:#101216; --on-ink:#F5F6F8; --pin:#E8402D;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0D1015; --bg-a:rgba(13,16,21,.84); --surface:#171A21; --field:#20242D; --paper:#232834;
      --fg:#EEF0F4; --dim:#8F95A3; --line:rgba(255,255,255,.1);
      --ink:#EEF0F4; --on-ink:#101216; --pin:#FF5B45;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0D1015; --bg-a:rgba(13,16,21,.84); --surface:#171A21; --field:#20242D; --paper:#232834;
    --fg:#EEF0F4; --dim:#8F95A3; --line:rgba(255,255,255,.1);
    --ink:#EEF0F4; --on-ink:#101216; --pin:#FF5B45;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { background:var(--bg); }
  body {
    margin:0 auto; max-width:920px; min-height:100vh; color:var(--fg); background:var(--bg);
    font:16px/1.4 "Onest",-apple-system,system-ui,"SF Pro Text",sans-serif;
    padding:0 16px calc(env(safe-area-inset-bottom) + 120px);
  }
  .ic { width:22px; height:22px; flex:none; }
  .ic.sm { width:18px; height:18px; }
  button { font:inherit; color:inherit; cursor:pointer; transition:transform .25s var(--ease), opacity .25s, background .25s; }
  button:active { transform:scale(.96); }
  :focus-visible { outline:2px solid var(--pin); outline-offset:2px; }

  /* Шапка */
  header {
    position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between;
    margin:0 -16px; padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background:var(--bg-a); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:20px; letter-spacing:-.03em; }
  .brand .logo { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; background:var(--pin); }
  .avatar { width:40px; height:40px; border-radius:50%; border:0; display:grid; place-items:center; color:#fff; font-weight:700; font-size:17px;
    background:linear-gradient(135deg,#ff5a5f,#ff9a6b); }
  .avatar { overflow:hidden; }
  .avatar img { width:100%; height:100%; object-fit:cover; display:block; }
  .avatar.big { width:96px; height:96px; font-size:38px; margin:0 auto; }

  /* Строка добавления: плавает внизу */
  .dock { position:fixed; left:0; right:0; bottom:0; z-index:8; display:flex; justify-content:center; pointer-events:none;
    padding:10px 14px calc(env(safe-area-inset-bottom) + 12px); }
  .adder { pointer-events:auto; width:100%; max-width:560px; display:flex; align-items:flex-end; gap:8px;
    padding:6px 6px 6px 18px; border-radius:32px; background:var(--ink); color:var(--on-ink);
    box-shadow:0 12px 32px rgba(0,0,0,.28); transition:box-shadow .3s; }
  .adder:focus-within { box-shadow:0 12px 32px rgba(0,0,0,.28), 0 0 0 3px var(--pin); }
  .adder .ic.lead { opacity:.55; margin:12px 0; }
  textarea { flex:1; min-width:0; background:transparent; border:0; outline:0; color:inherit; font:inherit; resize:none;
    height:46px; max-height:120px; padding:12px 0; }
  textarea::placeholder { color:var(--on-ink); opacity:.5; }
  .round { width:46px; height:46px; flex:none; border-radius:50%; border:0; display:grid; place-items:center;
    background:rgba(127,127,127,.24); color:inherit; }
  .round.go { background:var(--pin); color:#fff; }
  .round:disabled { opacity:.5; }
  .spin { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Разделы: стопки отпечатков */
  #tiles { display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x proximity; scroll-padding-inline:22px; margin:6px -16px 0; padding:14px 22px 16px;
    scrollbar-width:none; }
  #tiles::-webkit-scrollbar { display:none; }
  .tile { flex:none; width:96px; background:none; border:0; padding:0; text-align:left; display:flex; flex-direction:column; gap:14px;
    scroll-snap-align:start; color:var(--fg); }
  .stack { position:relative; width:96px; height:112px; transition:transform .45s var(--ease); }
  .pic { position:absolute; inset:0; border-radius:10px; background:var(--paper); border:1px solid var(--line); overflow:hidden;
    box-shadow:0 6px 14px rgba(0,0,0,.14); display:grid; place-items:center; color:var(--dim);
    transition:transform .45s var(--ease); }
  .pic img,.pic video { width:100%; height:100%; object-fit:cover; display:block; }
  .pic.p2 { transform:rotate(-9deg) translate(-7px,3px); }
  .pic.p1 { transform:rotate(7deg) translate(6px,1px); }
  .tile.on .stack { transform:translateY(-5px); }
  .tile.on .pic.p2 { transform:rotate(-4deg) translate(-5px,1px); }
  .tile.on .pic.p1 { transform:rotate(3deg) translate(4px,0); }
  .pic.blank { box-shadow:none; background:transparent; border:1.5px dashed var(--dim); }
  .nm { display:flex; flex-direction:column; min-width:0; }
  .nm b { font-size:14px; font-weight:600; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nm small { font-size:12.5px; color:var(--dim); }
  .tile.on .nm b::before { content:""; display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--pin); margin-right:6px; vertical-align:1px; }

  /* Заголовок раздела */
  #sechead { display:flex; align-items:center; justify-content:space-between; margin:10px 2px 14px; min-height:44px; }
  #sechead h2 { margin:0; font-size:40px; line-height:1; font-weight:700; letter-spacing:-.045em; }
  #sechead h2 span { font-size:17px; font-weight:500; letter-spacing:0; color:var(--dim); margin-left:10px; }
  .mini { display:flex; gap:8px; }
  .mini button { width:40px; height:40px; border:0; border-radius:50%; background:var(--field); display:grid; place-items:center; }

  /* Сетка: почти встык */
  #grid { columns:var(--cols,2); column-gap:6px; }
  @media (min-width:600px){ #grid { columns:var(--colsw,3); } }
  .item { position:relative; break-inside:avoid; margin-bottom:6px; border-radius:12px; overflow:hidden; background:var(--field); min-height:80px;
    animation:fade .3s ease both; transition:transform .25s var(--ease); }
  .item:active { transform:scale(.98); }
  .item img,.item video { display:block; width:100%; height:auto; pointer-events:none; }
  .badge { position:absolute; right:8px; bottom:8px; width:28px; height:28px; border-radius:50%; display:grid; place-items:center;
    background:rgba(0,0,0,.55); color:#fff; }
  .empty { text-align:center; color:var(--dim); padding:48px 10px; column-span:all; }
  .empty .ic { width:40px; height:40px; opacity:.5; margin-bottom:10px; }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }

  /* Просмотр */
  #viewer { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; background:#050608; color:#fff;
    opacity:0; visibility:hidden; transition:opacity .3s var(--ease), visibility 0s .3s; }
  #viewer.open { opacity:1; visibility:visible; transition-delay:0s; }
  #vtop { display:flex; justify-content:flex-end; padding:calc(env(safe-area-inset-top) + 10px) 14px 0; }
  #vtop .round { background:rgba(255,255,255,.14); color:#fff; }
  #stage { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:10px; }
  #stage img,#stage video { max-width:100%; max-height:100%; border-radius:14px; }
  #vbar { display:flex; justify-content:space-around; padding:10px 12px calc(env(safe-area-inset-bottom) + 14px); }
  #vbar button { background:none; border:0; color:#fff; display:flex; flex-direction:column; align-items:center; gap:6px; font-size:12.5px; min-width:64px; }
  #vbar .ic { width:52px; height:52px; padding:15px; border-radius:50%; background:rgba(255,255,255,.14); }
  #vbar .del { color:#ff8f80; }

  /* Шторка */
  #sw { position:fixed; inset:0; z-index:30; visibility:hidden; transition:visibility 0s .4s; }
  #sw.open { visibility:visible; transition-delay:0s; }
  #backdrop { position:absolute; inset:0; background:rgba(0,0,0,.5); opacity:0; transition:opacity .4s var(--ease); }
  #sw.open #backdrop { opacity:1; }
  #sheet { position:absolute; left:0; right:0; bottom:0; max-width:560px; margin:0 auto; max-height:88vh; overflow:auto;
    background:var(--surface); border-radius:28px 28px 0 0; padding:10px 20px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(105%); transition:transform .45s var(--ease); }
  #sw.open #sheet { transform:none; }
  .grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 16px; }
  #sheet h3 { margin:0 0 16px; font-size:20px; font-weight:700; letter-spacing:-.02em; text-align:center; }
  .field { width:100%; background:var(--field); border:1.5px solid transparent; border-radius:14px; color:var(--fg); font:inherit; padding:13px 14px; outline:0; transition:border-color .25s; }
  .field:focus { border-color:var(--pin); }
  .fl { display:block; color:var(--dim); font-size:13px; margin:16px 4px 6px; }
  .btn { width:100%; margin-top:14px; padding:14px; border:0; border-radius:16px; font-weight:600; background:var(--ink); color:var(--on-ink); }
  .btn:disabled { opacity:.55; }
  .btn.sec { background:var(--field); color:var(--fg); margin-top:8px; }
  .btn.dng { background:transparent; color:var(--pin); box-shadow:inset 0 0 0 1.5px var(--line); }
  .btn .in { display:inline-flex; gap:8px; align-items:center; justify-content:center; }
  .dots { display:flex; gap:12px; justify-content:center; margin:14px 0 4px; }
  .dot { width:30px; height:30px; border-radius:50%; border:2px solid transparent; transition:transform .3s var(--ease), box-shadow .3s; }
  .dot.on { transform:scale(1.15); box-shadow:0 0 0 2px var(--surface), 0 0 0 4px var(--fg); }
  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:16px; }
  .stat { background:var(--field); border-radius:14px; padding:12px 6px; text-align:center; }
  .stat b { display:block; font-size:20px; font-weight:700; } .stat small { color:var(--dim); font-size:12.5px; }
  .mail { text-align:center; color:var(--dim); font-size:14px; margin-top:12px; word-break:break-all; }
  .opt { width:100%; display:flex; align-items:center; gap:12px; padding:14px 14px; border:0; border-radius:14px; background:var(--field); margin-bottom:8px; text-align:left; }
  .opt .ck { margin-left:auto; color:var(--pin); }

  /* Экран входа */
  #auth { position:fixed; inset:0; z-index:50; overflow:auto; display:flex; background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);
    opacity:0; visibility:hidden; transition:opacity .4s var(--ease), visibility 0s .4s; }
  #auth.open { opacity:1; visibility:visible; transition-delay:0s; }
  .authbox { margin:auto; width:100%; max-width:380px; }
  .stack.hero { width:88px; height:104px; margin:0 auto 26px; }
  .stack.hero .pic { box-shadow:0 8px 18px rgba(0,0,0,.16); }
  .brand.big { justify-content:center; font-size:30px; }
  .sub { text-align:center; color:var(--dim); margin:10px 0 24px; font-size:15px; }
  .seg { display:grid; grid-template-columns:1fr 1fr; background:var(--field); border-radius:16px; padding:4px; margin-bottom:14px; }
  .seg button { border:0; background:transparent; padding:10px; border-radius:12px; font-weight:600; color:var(--dim); }
  .seg button.on { background:var(--surface); color:var(--fg); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .seg.s3 { grid-template-columns:repeat(3,1fr); }
  .seg.tight { margin-bottom:0; }
  textarea.field { height:auto; min-height:76px; resize:none; display:block; flex:none; }
  .field::placeholder, textarea.field::placeholder { color:var(--dim); opacity:.75; }
  .dots + .fl { margin-top:22px; }
  .chips { display:flex; gap:8px; justify-content:center; margin:14px 0 0; flex-wrap:wrap; }
  .chip { display:inline-flex; gap:6px; align-items:center; padding:9px 15px; border:0; border-radius:999px; background:var(--field); font-weight:600; font-size:14px; }
  .bio { text-align:center; color:var(--dim); font-size:14px; margin-top:6px; }
  .authbox .field { margin-bottom:10px; }
  .or { display:flex; align-items:center; gap:10px; color:var(--dim); font-size:13px; margin:18px 0 2px; }
  .or::before,.or::after { content:""; flex:1; height:1px; background:var(--line); }
  .prov { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:8px; }
  .linkbtn { display:block; margin:16px auto 0; background:none; border:0; color:var(--dim); font-size:14px; }
  .amsg { min-height:20px; text-align:center; font-size:14px; margin-top:12px; }
  .amsg.err { color:var(--pin); } .amsg.ok { color:#1f9d63; }

  /* Уведомление */
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 94px); z-index:60; max-width:88vw;
    transform:translate(-50%,16px); opacity:0; pointer-events:none; padding:12px 18px; border-radius:18px; font-size:14px;
    background:var(--ink); color:var(--on-ink); transition:transform .4s var(--ease), opacity .3s; }
  #toast.show { transform:translate(-50%,0); opacity:1; }
  #toast.err { background:var(--pin); color:#fff; }

  @media (prefers-reduced-motion:reduce){ *{ animation:none!important; transition:none!important; } }
</style>
</head>

<header>
  <div class="brand"><span class="logo"><svg class="ic sm"><use href="#i-logo"/></svg></span>PinBox</div>
  <button class="avatar" id="avatarBtn" aria-label="Аккаунт"></button>
</header>

<div id="tiles"></div>
<div id="sechead"></div>
<div id="grid"></div>

<div class="dock">
  <div class="adder">
    <svg class="ic lead"><use href="#i-link"/></svg>
    <textarea id="link" rows="1" placeholder="Вставь ссылку на пин" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>
    <button class="round" id="paste" aria-label="Вставить"><svg class="ic"><use href="#i-paste"/></svg></button>
    <button class="round go" id="save" aria-label="Скачать"><svg class="ic" id="saveIc"><use href="#i-download"/></svg></button>
  </div>
</div>

<div id="viewer">
  <div id="vtop"><button class="round" id="vclose" aria-label="Закрыть"><svg class="ic"><use href="#i-close"/></svg></button></div>
  <div id="stage"></div>
  <div id="vbar">
    <button id="vsave"><svg class="ic"><use href="#i-share"/></svg>Сохранить</button>
    <button id="vcol"><svg class="ic"><use href="#i-folder"/></svg>Раздел</button>
    <button id="vopen"><svg class="ic"><use href="#i-ext"/></svg>Pinterest</button>
    <button id="vdel" class="del"><svg class="ic"><use href="#i-trash"/></svg>Удалить</button>
  </div>
</div>

<div id="sw"><div id="backdrop"></div><div id="sheet"></div></div>
<div id="auth"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// ───── Утилиты ─────
const $ = (id) => document.getElementById(id);
const ic = (n, c = '') => '<svg class="ic ' + c + '"><use href="#i-' + n + '"/></svg>';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mb = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + ' МБ' : Math.round(n / 1024) + ' КБ');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));

let tt;
function toast(msg, o = {}) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (o.err ? ' err' : '');
  clearTimeout(tt);
  if (!o.sticky) tt = setTimeout(() => (t.className = ''), o.err ? 4500 : 2600);
}
function hideToast() { clearTimeout(tt); $('toast').className = ''; }

// ───── Подключение ─────
const C = window.CONFIG || {};
const configured = !!(C.SUPABASE_URL && C.SUPABASE_KEY && window.supabase);
const sb = configured ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY) : null;
const WORKER = () => (C.WORKER_URL || localStorage.getItem('worker') || '').replace(/\/+$/, '');
const pub = (p) => sb.storage.from('pins').getPublicUrl(p).data.publicUrl;

// ───── Состояние ─────
const GRADS = [['#ff5a5f', '#ff9a6b'], ['#7c5cff', '#4fc3ff'], ['#00c9a7', '#4dd0e1'], ['#ffb347', '#ff6f91'], ['#b490ca', '#5ee7df'], ['#56ab2f', '#a8e063']];
let user = null, items = [], cols = [], section = 'all', loading = true;
let current = null, blobP = null;

const meta = () => (user && user.user_metadata) || {};
const profile = () => ({
  name: meta().name || '',
  bio: meta().bio || '',
  grad: Number.isInteger(meta().grad) ? meta().grad : 0,
  avatar: meta().avatar || '',
});
const inSection = (it, k) => k === 'all' || (k === 'image' && it.type === 'image') || (k === 'video' && it.type === 'video') || (k.startsWith('c:') && it.col === k.slice(2));

// Оформление: хранится на телефоне и в профиле (чтобы совпадало на всех устройствах)
const ACCENTS = [
  { l: '#E8402D', d: '#FF5B45' }, { l: '#DD5A0B', d: '#FF8239' }, { l: '#6B46F5', d: '#9C86FF' },
  { l: '#1D63F0', d: '#5C98FF' }, { l: '#15935A', d: '#2FBE7A' }, { l: '#D42070', d: '#FF5C9B' },
];
const PREF_DEFAULT = { theme: 'auto', accent: 0, cols: 2 };
function prefs() {
  let p = {};
  try { p = JSON.parse(localStorage.getItem('pb_prefs') || '{}') || {}; } catch (e) { /* пусто */ }
  return {
    theme: ['auto', 'light', 'dark'].includes(p.theme) ? p.theme : PREF_DEFAULT.theme,
    accent: Number.isInteger(p.accent) && p.accent >= 0 && p.accent < ACCENTS.length ? p.accent : PREF_DEFAULT.accent,
    cols: p.cols === 3 ? 3 : 2,
  };
}
const darkMQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyPrefs() {
  const p = prefs(), root = document.documentElement;
  if (p.theme === 'light' || p.theme === 'dark') root.setAttribute('data-theme', p.theme); else root.removeAttribute('data-theme');
  const dark = p.theme === 'dark' || (p.theme !== 'light' && !!darkMQ && darkMQ.matches);
  const a = ACCENTS[p.accent];
  root.style.setProperty('--pin', dark ? a.d : a.l);
  root.style.setProperty('--cols', p.cols === 3 ? 3 : 2);
  root.style.setProperty('--colsw', p.cols === 3 ? 4 : 3);
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => { m.removeAttribute('media'); m.setAttribute('content', dark ? '#0D1015' : '#F2F3F5'); });
}
if (darkMQ && darkMQ.addEventListener) darkMQ.addEventListener('change', applyPrefs);
applyPrefs();

// Сохранение в профиль с небольшой задержкой, чтобы не слать запрос на каждое нажатие
let pendingMeta = {}, metaT;
function saveMeta(patch) {
  if (!user) return;
  user.user_metadata = { ...meta(), ...patch };
  Object.assign(pendingMeta, patch);
  clearTimeout(metaT);
  metaT = setTimeout(async () => {
    const data = pendingMeta; pendingMeta = {};
    const r = await sb.auth.updateUser({ data });
    if (r.error) return toast('Не удалось сохранить профиль', { err: true });
  }, 500);
}
function setPrefs(patch) {
  try { localStorage.setItem('pb_prefs', JSON.stringify({ ...prefs(), ...patch })); } catch (e) { /* нет хранилища */ }
  applyPrefs();
  saveMeta(patch);
}
function pullPrefs() {
  const m = meta(), patch = {};
  ['theme', 'accent', 'cols'].forEach((k) => { if (m[k] !== undefined) patch[k] = m[k]; });
  if (Object.keys(patch).length) {
    try { localStorage.setItem('pb_prefs', JSON.stringify({ ...prefs(), ...patch })); } catch (e) { /* нет хранилища */ }
    applyPrefs();
  }
}

function gradCss(i) { const g = GRADS[i] || GRADS[0]; return 'background:linear-gradient(135deg,' + g[0] + ',' + g[1] + ')'; }
function paintAvatar(name, grad, avatar) {
  const html = avatar && sb ? '<img alt="" src="' + esc(pub(avatar)) + '">' : (name ? esc(name.trim().charAt(0).toUpperCase()) : ic('user'));
  [$('avatarBtn'), $('bigAv')].forEach((el) => { if (el) { el.setAttribute('style', gradCss(grad)); el.innerHTML = html; } });
}
function refreshAvatar() { const p = profile(); paintAvatar(p.name, p.grad, p.avatar); }

// ───── Данные ─────
async function loadAll() {
  const [a, b] = await Promise.all([
    sb.from('items').select('*').order('added', { ascending: false }),
    sb.from('collections').select('*').order('created', { ascending: true }),
  ]);
  if (a.error || b.error) { toast('Не удалось загрузить: ' + (a.error || b.error).message, { err: true }); return; }
  items = a.data.map((r) => ({ ...r, url: pub(r.path) }));
  cols = b.data;
}

// ───── Рендер ─────
function mediaTag(it, extra) {
  return it.type === 'video'
    ? '<video muted playsinline preload="metadata" src="' + it.url + '#t=0.1"></video>'
    : '<img ' + (extra || '') + ' src="' + it.url + '">';
}

function tileDefs() {
  return [
    { key: 'all', name: 'Все', icon: 'grid' },
    { key: 'image', name: 'Фото', icon: 'image' },
    { key: 'video', name: 'Видео', icon: 'video' },
  ].concat(cols.map((c) => ({ key: 'c:' + c.id, name: c.name, icon: 'folder' })));
}

function render() {
  if (!tileDefs().find((t) => t.key === section)) section = 'all';

  let html = '';
  tileDefs().forEach((t, i) => {
    const list = items.filter((it) => inSection(it, t.key));
    let layers = '';
    for (let k = Math.min(list.length, 3) - 1; k >= 0; k--) layers += '<div class="pic p' + k + '">' + mediaTag(list[k]) + '</div>';
    if (!layers) layers = '<div class="pic p0">' + ic(t.icon) + '</div>';
    html += '<button class="tile' + (t.key === section ? ' on' : '') + '" data-key="' + t.key + '">' +
      '<div class="stack">' + layers + '</div>' +
      '<span class="nm"><b>' + esc(t.name) + '</b><small>' + list.length + '</small></span></button>';
  });
  html += '<button class="tile new" id="newCol"><div class="stack"><div class="pic p0 blank">' + ic('plus') + '</div></div>' +
    '<span class="nm"><b>Новый</b><small>раздел</small></span></button>';
  $('tiles').innerHTML = html;
  $('tiles').querySelectorAll('.tile[data-key]').forEach((el) => (el.onclick = () => { section = el.dataset.key; render(); }));
  $('newCol').onclick = () => ask('Новый раздел', '', async (name) => {
    const r = await sb.from('collections').insert({ name }).select().single();
    if (r.error) return toast('Не удалось создать раздел', { err: true });
    cols.push(r.data); section = 'c:' + r.data.id; render();
  });

  const def = tileDefs().find((t) => t.key === section);
  const list = items.filter((it) => inSection(it, section));
  const isCol = section.startsWith('c:');
  $('sechead').innerHTML = '<h2>' + esc(def.name) + '<span>' + list.length + '</span></h2>' +
    (isCol ? '<div class="mini"><button id="renCol" aria-label="Переименовать">' + ic('edit', 'sm') + '</button><button id="delCol" aria-label="Удалить раздел">' + ic('trash', 'sm') + '</button></div>' : '');
  if (isCol) {
    const id = section.slice(2);
    $('renCol').onclick = () => ask('Название раздела', def.name, async (name) => {
      const r = await sb.from('collections').update({ name }).eq('id', id);
      if (r.error) return toast('Не удалось переименовать', { err: true });
      cols = cols.map((c) => (c.id === id ? { ...c, name } : c)); render();
    });
    $('delCol').onclick = async () => {
      if (!confirm('Удалить раздел «' + def.name + '»? Файлы останутся в «Все».')) return;
      const r = await sb.from('collections').delete().eq('id', id);
      if (r.error) return toast('Не удалось удалить раздел', { err: true });
      cols = cols.filter((c) => c.id !== id);
      items.forEach((it) => { if (it.col === id) it.col = null; });
      section = 'all'; render();
    };
  }

  const grid = $('grid');
  if (loading) { grid.innerHTML = '<div class="empty">Загружаю…</div>'; return; }
  if (!list.length) {
    grid.innerHTML = '<div class="empty">' + ic('image') + '<div>' + (section === 'all' ? 'Пока пусто.<br>Скопируй ссылку на пин и вставь её внизу.' : 'В этом разделе пока ничего.') + '</div></div>';
    return;
  }
  grid.innerHTML = '';
  list.forEach((it, i) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.innerHTML = mediaTag(it, 'loading="lazy"') + (it.type === 'video' ? '<span class="badge">' + ic('play', 'sm') + '</span>' : '');
    el.onclick = () => openViewer(it);
    grid.appendChild(el);
  });
}

// ───── Шторка ─────
function openSheet(html) { $('sheet').innerHTML = '<div class="grab"></div>' + html; $('sw').classList.add('open'); }
function closeSheet() { $('sw').classList.remove('open'); }
$('backdrop').onclick = closeSheet;

function ask(title, val, cb) {
  openSheet('<h3>' + esc(title) + '</h3><input id="askin" class="field" maxlength="30" value="' + esc(val) + '" placeholder="Название"><button class="btn" id="askok">Готово</button>');
  const done = () => { const v = $('askin').value.trim(); if (!v) return; closeSheet(); cb(v); };
  $('askok').onclick = done;
  $('askin').onkeydown = (e) => { if (e.key === 'Enter') done(); };
  setTimeout(() => $('askin').focus(), 350);
}

// ───── Просмотр ─────
function openViewer(it) {
  current = it;
  blobP = it.type === 'image' ? fetch(it.url).then((r) => (r.ok ? r.blob() : null)).catch(() => null) : null;
  $('stage').innerHTML = it.type === 'video'
    ? '<video src="' + it.url + '" controls autoplay playsinline loop></video>'
    : '<img src="' + it.url + '">';
  $('viewer').classList.add('open');
}
function closeViewer() {
  $('viewer').classList.remove('open');
  setTimeout(() => { if (!$('viewer').classList.contains('open')) $('stage').innerHTML = ''; }, 380);
  current = null; blobP = null;
}
$('vclose').onclick = closeViewer;

$('vdel').onclick = async () => {
  if (!current || !confirm('Удалить из избранного?')) return;
  const it = current;
  closeViewer();
  const r = await sb.from('items').delete().eq('id', it.id);
  if (r.error) return toast('Не удалось удалить', { err: true });
  await sb.storage.from('pins').remove([it.path]);
  items = items.filter((x) => x.id !== it.id);
  render();
};
$('vopen').onclick = () => { if (current && current.pin_url) window.open(current.pin_url, '_blank'); };

$('vsave').onclick = async () => {
  if (!current) return;
  const it = current;
  toast('Готовлю файл…', { sticky: true });
  const blob = await (blobP || fetch(it.url).then((r) => (r.ok ? r.blob() : null)).catch(() => null));
  if (!blob) return toast('Не удалось получить файл', { err: true });
  const file = new File([blob], 'pin-' + it.id.slice(0, 8) + '.' + it.path.split('.').pop(), { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); hideToast(); return; }
    throw new Error('noshare');
  } catch (e) {
    if (e && e.name === 'AbortError') return hideToast();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
    toast('Файл скачан');
  }
};

$('vcol').onclick = () => {
  if (!current) return;
  const it = current;
  const opts = [{ id: '', name: 'Без раздела' }].concat(cols);
  openSheet('<h3>Переместить в раздел</h3>' + opts.map((o) =>
    '<button class="opt" data-id="' + o.id + '">' + ic('folder') + esc(o.name) + ((it.col || '') === o.id ? '<span class="ck">' + ic('check') + '</span>' : '') + '</button>').join(''));
  $('sheet').querySelectorAll('.opt').forEach((b) => (b.onclick = async () => {
    const col = b.dataset.id || null;
    const r = await sb.from('items').update({ col }).eq('id', it.id);
    if (r.error) return toast('Не удалось переместить', { err: true });
    it.col = col;
    closeSheet(); toast('Перемещено'); render();
  }));
};

// ───── Аккаунт ─────
$('avatarBtn').onclick = () => { if (user) openAccount(); };

// Фото профиля: обрезаем до квадрата и уменьшаем, чтобы весило около 20 КБ
function squareJpeg(file, size) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const c = document.createElement('canvas');
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, (img.naturalWidth - s) / 2, (img.naturalHeight - s) / 2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob((b) => (b ? res(b) : rej(new Error('jpeg'))), 'image/jpeg', 0.86);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

async function uploadAvatar(file) {
  if (!file) return;
  toast('Загружаю фото…', { sticky: true });
  try {
    const blob = await squareJpeg(file, 320);
    const path = user.id + '/avatar-' + uid() + '.jpg';
    const up = await sb.storage.from('pins').upload(path, blob, { contentType: 'image/jpeg', cacheControl: '31536000' });
    if (up.error) throw up.error;
    const old = profile().avatar;
    saveMeta({ avatar: path });
    if (old) sb.storage.from('pins').remove([old]);
    refreshAvatar();
    hideToast(); toast('Фото обновлено');
    openAccount();
  } catch (e) { toast('Не удалось загрузить фото', { err: true }); }
}

function removeAvatar() {
  const old = profile().avatar;
  if (!old) return;
  saveMeta({ avatar: '' });
  sb.storage.from('pins').remove([old]);
  refreshAvatar();
  openAccount();
}

function seg(id, opts, cur) {
  return '<div class="seg s' + opts.length + '" id="' + id + '">' + opts.map((o) =>
    '<button data-v="' + o[0] + '" class="' + (String(o[0]) === String(cur) ? 'on' : '') + '">' + o[1] + '</button>').join('') + '</div>';
}
function wireSeg(id, cb) {
  const box = $(id);
  box.querySelectorAll('button').forEach((b) => (b.onclick = () => {
    box.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
    cb(b.dataset.v);
  }));
}

function openAccount() {
  const p = profile(), pr = prefs();
  const photos = items.filter((i) => i.type === 'image').length;
  const total = items.reduce((s, i) => s + (i.size || 0), 0);
  openSheet(
    '<h3>Профиль</h3>' +
    '<div class="avatar big" id="bigAv"></div>' +
    '<div class="chips"><button class="chip" id="avPick">' + ic('image', 'sm') + (p.avatar ? 'Другое фото' : 'Добавить фото') + '</button>' +
    (p.avatar ? '<button class="chip" id="avDel">Убрать фото</button>' : '') + '</div>' +
    '<input type="file" id="avFile" accept="image/*" hidden>' +
    '<div class="dots" id="gDots">' + GRADS.map((g, i) => '<button class="dot' + (i === p.grad ? ' on' : '') + '" data-i="' + i + '" style="' + gradCss(i) + '" aria-label="Цвет аватара"></button>').join('') + '</div>' +
    '<label class="fl">Имя</label><input class="field" id="pName" maxlength="24" value="' + esc(p.name) + '" placeholder="Как тебя зовут?">' +
    '<label class="fl">О себе</label><textarea class="field" id="pBio" maxlength="80" placeholder="Пара слов о себе">' + esc(p.bio) + '</textarea>' +
    '<label class="fl">Тема</label>' + seg('thSeg', [['auto', 'Авто'], ['light', 'Светлая'], ['dark', 'Тёмная']], pr.theme) +
    '<label class="fl">Цвет акцента</label><div class="dots" id="acDots">' + ACCENTS.map((a, i) => '<button class="dot' + (i === pr.accent ? ' on' : '') + '" data-i="' + i + '" style="background:' + a.l + '" aria-label="Акцент"></button>').join('') + '</div>' +
    '<label class="fl">Размер картинок</label>' + seg('colSeg', [[2, 'Крупно'], [3, 'Мелко']], pr.cols) +
    '<label class="fl">Вход</label>' +
    '<div class="mail" style="margin:0 0 4px">' + esc(user.email || '') + '</div>' +
    '<button class="btn sec" id="chgMail">Сменить почту</button>' +
    '<button class="btn sec" id="chgPass">Сменить пароль</button>' +
    '<div class="stats"><div class="stat"><b>' + items.length + '</b><small>всего</small></div><div class="stat"><b>' + photos + '</b><small>фото</small></div><div class="stat"><b>' + (items.length - photos) + '</b><small>видео</small></div></div>' +
    '<div class="mail">Занято в облаке: ' + mb(total) + '</div>' +
    '<button class="btn sec" id="out"><span class="in">' + ic('logout', 'sm') + 'Выйти</span></button>' +
    '<button class="btn dng" id="wipe"><span class="in">' + ic('trash', 'sm') + 'Удалить все файлы</span></button>'
  );
  paintAvatar(p.name, p.grad, p.avatar);

  let grad = p.grad;
  $('avPick').onclick = () => $('avFile').click();
  $('avFile').onchange = () => uploadAvatar($('avFile').files[0]);
  if ($('avDel')) $('avDel').onclick = removeAvatar;

  $('pName').oninput = () => paintAvatar($('pName').value, grad, profile().avatar);
  $('pName').onchange = () => { saveMeta({ name: $('pName').value.trim() }); refreshAvatar(); };
  $('pBio').onchange = () => saveMeta({ bio: $('pBio').value.trim() });

  $('gDots').querySelectorAll('.dot').forEach((d) => (d.onclick = () => {
    grad = +d.dataset.i;
    $('gDots').querySelectorAll('.dot').forEach((x) => x.classList.toggle('on', x === d));
    saveMeta({ grad });
    paintAvatar($('pName').value, grad, profile().avatar); refreshAvatar();
  }));
  $('acDots').querySelectorAll('.dot').forEach((d) => (d.onclick = () => {
    $('acDots').querySelectorAll('.dot').forEach((x) => x.classList.toggle('on', x === d));
    setPrefs({ accent: +d.dataset.i });
  }));
  wireSeg('thSeg', (v) => setPrefs({ theme: v }));
  wireSeg('colSeg', (v) => setPrefs({ cols: +v }));

  $('chgMail').onclick = openChangeEmail;
  $('chgPass').onclick = openNewPassword;
  $('out').onclick = async () => { closeSheet(); await sb.auth.signOut(); };
  $('wipe').onclick = async () => {
    if (!confirm('Удалить все файлы из избранного на всех устройствах? Это нельзя отменить.')) return;
    toast('Удаляю…', { sticky: true });
    const paths = items.map((i) => i.path);
    for (let i = 0; i < paths.length; i += 100) await sb.storage.from('pins').remove(paths.slice(i, i + 100));
    await sb.from('items').delete().eq('user_id', user.id);
    await loadAll(); closeSheet(); toast('Всё удалено'); render();
  };
}

function openChangeEmail() {
  openSheet('<h3>Новая почта</h3><input id="nem" class="field" type="email" inputmode="email" autocomplete="email" placeholder="Новый адрес" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<div class="mail" style="margin-top:10px">Мы отправим письмо со ссылкой. Пока не подтвердишь, входить нужно по старой почте.</div>' +
    '<button class="btn" id="nemok">Отправить письмо</button>');
  $('nemok').onclick = async () => {
    const v = $('nem').value.trim();
    if (!/^\S+@\S+\.\S+$/.test(v)) return toast('Проверь адрес почты', { err: true });
    $('nemok').disabled = true;
    const r = await sb.auth.updateUser({ email: v }, { emailRedirectTo: redirectUrl() });
    $('nemok').disabled = false;
    if (r.error) return toast(errRu(r.error.message), { err: true });
    closeSheet(); toast('Письмо отправлено');
  };
}

function openNewPassword() {
  openSheet('<h3>Новый пароль</h3><input id="npw" class="field" type="password" autocomplete="new-password" placeholder="Минимум 6 символов"><button class="btn" id="npok">Сохранить</button>');
  $('npok').onclick = async () => {
    const v = $('npw').value;
    if (v.length < 6) return toast('Минимум 6 символов', { err: true });
    const r = await sb.auth.updateUser({ password: v });
    if (r.error) return toast(errRu(r.error.message), { err: true });
    closeSheet(); toast('Пароль обновлён');
  };
}

// ───── Вход ─────
function errRu(m) {
  m = m || '';
  if (/invalid login/i.test(m)) return 'Неверная почта или пароль';
  if (/already registered/i.test(m)) return 'Эта почта уже зарегистрирована';
  if (/at least|weak/i.test(m)) return 'Пароль: минимум 6 символов';
  if (/rate limit|too many|seconds/i.test(m)) return 'Слишком много попыток, подожди немного';
  if (/valid email|invalid email/i.test(m)) return 'Проверь адрес почты';
  if (/not confirmed/i.test(m)) return 'Подтверди почту по ссылке из письма';
  return m;
}
function authMsg(t, ok) { const m = $('aMsg'); if (m) { m.textContent = t; m.className = 'amsg' + (t ? (ok ? ' ok' : ' err') : ''); } }
const redirectUrl = () => location.origin + location.pathname;

function showAuth(mode) {
  mode = mode || 'in';
  const a = $('auth');
  a.classList.add('open');
  const head = '<div class="stack hero">' +
    '<div class="pic p2" style="background:linear-gradient(160deg,#ffb4a2,#ff7a66);border:0"></div>' +
    '<div class="pic p1" style="background:linear-gradient(160deg,#b8d0ff,#7fa6ff);border:0"></div>' +
    '<div class="pic p0" style="color:var(--pin)">' + ic('logo') + '</div></div>' +
    '<div class="brand big">PinBox</div>';
  if (!configured) {
    a.innerHTML = '<div class="authbox">' + head + '<p class="sub">Сайт ещё не подключён к Supabase. Открой файл config.js в репозитории и вставь адрес и ключ проекта. Шаги в README.</p></div>';
    return;
  }
  const up = mode === 'up';
  const prov = C.PROVIDERS || [];
  a.innerHTML = '<div class="authbox">' + head +
    '<p class="sub">Твоё избранное из Pinterest на всех устройствах</p>' +
    '<div class="seg"><button data-m="in" class="' + (up ? '' : 'on') + '">Вход</button><button data-m="up" class="' + (up ? 'on' : '') + '">Регистрация</button></div>' +
    '<input id="aEmail" class="field" type="email" inputmode="email" autocomplete="email" placeholder="Почта" autocapitalize="off" autocorrect="off" spellcheck="false">' +
    '<input id="aPass" class="field" type="password" autocomplete="' + (up ? 'new-password' : 'current-password') + '" placeholder="Пароль (от 6 символов)">' +
    '<button class="btn" id="aGo">' + (up ? 'Создать аккаунт' : 'Войти') + '</button>' +
    (prov.length ? '<div class="or"><span>или</span></div><div class="prov">' + prov.map((p) =>
      '<button class="btn sec" data-p="' + p + '"><span class="in">' + ic(p) + (p === 'github' ? 'GitHub' : 'Google') + '</span></button>').join('') + '</div>' : '') +
    (up ? '' : '<button class="linkbtn" id="aForgot">Забыл пароль</button>') +
    '<div id="aMsg" class="amsg"></div></div>';

  a.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => showAuth(b.dataset.m)));

  const go = async () => {
    const email = $('aEmail').value.trim(), password = $('aPass').value;
    if (!email || !password) return authMsg('Введи почту и пароль');
    $('aGo').disabled = true; authMsg('');
    try {
      if (up) {
        const r = await sb.auth.signUp({ email, password });
        if (r.error) throw r.error;
        if (!r.data.session) authMsg('Мы отправили письмо. Подтверди почту по ссылке и войди.', true);
      } else {
        const r = await sb.auth.signInWithPassword({ email, password });
        if (r.error) throw r.error;
      }
    } catch (e) { authMsg(errRu(e.message)); }
    if ($('aGo')) $('aGo').disabled = false;
  };
  $('aGo').onclick = go;
  ['aEmail', 'aPass'].forEach((id) => ($(id).onkeydown = (e) => { if (e.key === 'Enter') go(); }));

  if ($('aForgot')) $('aForgot').onclick = async () => {
    const email = $('aEmail').value.trim();
    if (!email) return authMsg('Сначала введи почту');
    const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl() });
    authMsg(r.error ? errRu(r.error.message) : 'Письмо со ссылкой отправлено', !r.error);
  };
  a.querySelectorAll('[data-p]').forEach((b) => (b.onclick = async () => {
    const r = await sb.auth.signInWithOAuth({ provider: b.dataset.p, options: { redirectTo: redirectUrl() } });
    if (r.error) authMsg(errRu(r.error.message));
  }));
}

async function onLogin() {
  $('auth').classList.remove('open');
  pullPrefs();
  refreshAvatar();
  loading = true; render();
  await loadAll();
  loading = false; render();
}

// ───── Скачивание ─────
const ta = $('link');
ta.oninput = () => { ta.style.height = '44px'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; };
$('paste').onclick = async () => {
  try { ta.value = await navigator.clipboard.readText(); ta.oninput(); }
  catch { toast('Вставь вручную: долгое нажатие в поле', { err: true }); }
};

function extOf(type, blob, url) {
  if (type === 'video') return 'mp4';
  const m = /^image\/(\w+)/.exec(blob.type || '');
  if (m) return m[1].replace('jpeg', 'jpg');
  const u = /\.(jpe?g|png|webp|gif)(\?|$)/i.exec(url || '');
  return u ? u[1].toLowerCase().replace('jpeg', 'jpg') : 'jpg';
}

async function addOne(link, worker) {
  const r = await fetch(worker + '/?url=' + encodeURIComponent(link));
  const info = await r.json();
  if (!r.ok || info.error) throw new Error(info.error || 'Ошибка ' + r.status);
  const m = await fetch(worker + '/?media=' + encodeURIComponent(info.mediaUrl));
  if (!m.ok) {
    let why = '';
    try { why = (await m.json()).error; } catch (e) { /* не JSON */ }
    throw new Error(why || 'Файл не скачался (' + m.status + ')');
  }
  const blob = await m.blob();

  const ext = extOf(info.type, blob, info.mediaUrl);
  const path = user.id + '/' + uid() + '.' + ext;
  const contentType = info.type === 'video' ? 'video/mp4' : (ext === 'jpg' ? 'image/jpeg' : 'image/' + ext);
  const up = await sb.storage.from('pins').upload(path, blob, { contentType, cacheControl: '31536000' });
  if (up.error) throw new Error(/size|exceed/i.test(up.error.message) ? 'Файл больше 50 МБ — на бесплатном тарифе не помещается' : 'Загрузка: ' + up.error.message);

  const ins = await sb.from('items').insert({
    type: info.type, path, size: blob.size, title: info.title || '', pin_url: link,
    col: section.startsWith('c:') ? section.slice(2) : null,
  }).select().single();
  if (ins.error) { await sb.storage.from('pins').remove([path]); throw new Error('Не удалось сохранить запись'); }
  items.unshift({ ...ins.data, url: pub(path) });
}

$('save').onclick = async () => {
  if (!user) return;
  const worker = WORKER();
  if (!worker) { toast('Укажи WORKER_URL в config.js', { err: true }); return; }
  const links = ta.value.split(/\s+/).filter((s) => /^https?:\/\//i.test(s));
  if (!links.length) { toast('Вставь ссылку, начинающуюся с https://', { err: true }); return; }
  $('save').disabled = true;
  $('saveIc').innerHTML = '<use href="#i-loader"/>'; $('saveIc').classList.add('spin');
  let ok = 0, fail = 0, dup = 0, lastErr = '';
  for (let i = 0; i < links.length; i++) {
    if (items.some((x) => x.pin_url === links[i])) { dup++; continue; }
    toast('Скачиваю и загружаю ' + (i + 1) + ' из ' + links.length + '…', { sticky: true });
    try { await addOne(links[i], worker); ok++; } catch (e) { fail++; lastErr = e.message; }
  }
  $('save').disabled = false;
  $('saveIc').innerHTML = '<use href="#i-download"/>'; $('saveIc').classList.remove('spin');
  if (ok) { ta.value = ''; ta.oninput(); toast('Готово: ' + ok + (fail ? ', ошибок: ' + fail : '')); }
  else if (fail) toast(lastErr || 'Ничего не сохранено', { err: true });
  else if (dup) toast('Уже есть в избранном');
  render();
};

// ───── Запуск ─────
refreshAvatar();
if (!configured) {
  loading = false; render(); showAuth();
} else {
  sb.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
      const first = !user || user.id !== session.user.id;
      user = session.user;
      if (event === 'PASSWORD_RECOVERY') setTimeout(() => onLogin().then(openNewPassword), 0);
      else if (first) setTimeout(onLogin, 0);
    } else if (event === 'SIGNED_OUT' || event === 'INITIAL_SESSION') {
      user = null; items = []; cols = []; section = 'all'; loading = false;
      closeViewer(); closeSheet(); refreshAvatar(); render(); showAuth();
    }
  });
  // подтянуть изменения с другого телефона, когда возвращаешься на сайт
  document.addEventListener('visibilitychange', async () => {
    if (!document.hidden && user) { await loadAll(); render(); }
  });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
}
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
